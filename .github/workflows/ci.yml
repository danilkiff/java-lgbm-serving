name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # uv ставит колесо lightgbm по хешам; в нём лежит lib_lightgbm, которую
      # грузит FFM. libgomp на раннере Ubuntu уже есть.
      - name: Install uv
        # Версия пиннована: непиннованный installer делает раннер невоспроизводимым.
        run: |
          curl -LsSf https://astral.sh/uv/0.11.3/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Native LightGBM
        run: make native

      # Временно: репозиторий эталонов ещё не опубликован, поэтому эталоны
      # порождаются в чекауте go-lgbm-serving. Снимается заменой на
      # `make refs REFS=release:<tag>`.
      - uses: actions/checkout@v6
        with:
          repository: danilkiff/go-lgbm-serving
          path: .refs-src

      - name: Reference artifacts
        run: |
          cd .refs-src/training
          uv sync --no-default-groups
          make data

      - name: Fetch refs
        run: make refs REFS=local:.refs-src/training/testdata

      - name: Build and test
        run: make test

      - name: Benchmarks (smoke)
        run: make bench-smoke
