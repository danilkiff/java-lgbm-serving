name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # uv ставит колесо lightgbm по хешам; в нём лежит lib_lightgbm, которую
      # грузит FFM. libgomp на раннере Ubuntu уже есть.
      - name: Install uv
        # Версия пиннована: непиннованный installer делает раннер невоспроизводимым.
        run: |
          curl -LsSf https://astral.sh/uv/0.11.3/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Native LightGBM
        run: make native

      - name: Fetch refs
        run: make refs

      - name: Build and test
        run: make test

      - name: Benchmarks (smoke)
        run: make bench-smoke
